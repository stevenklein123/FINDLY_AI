<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Findly AI</title>
    <link rel="icon" type="image/png" href="../assets/eye.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/admin-dashboard.css" />
  </head>
  <body class="min-h-screen flex flex-col justify-between font-sans">
    <!-- Header -->
    <header class="w-full px-6 py-6 flex justify-center">
      <div class="admin-nav justify-center gap-3">
        <div class="nav-logo">
          <img
            src="../assets/eye.png"
            alt="Findly Eye Logo"
            class="w-8 h-8 object-contain"
          />
        </div>
        <h1 class="text-xl md:text-2xl font-bold text-slate-800 tracking-wide">
          Findly <span class="text-blue-600">AI</span> Admin Portal
        </h1>
      </div>
    </header>

    <!-- Login Box -->
    <main class="w-full max-w-md mx-auto px-6 py-8 mb-auto">
      <div
        class="bg-white/80 backdrop-blur-md border border-blue-200/60 rounded-2xl p-8 shadow-xl"
      >
        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold text-slate-800">Admin Sign In</h2>
          <p class="text-sm text-slate-500 mt-1">
            Access requires an authorized Administrator account
          </p>
        </div>

        <form id="adminLoginForm" class="space-y-4" novalidate>
          <div
            id="loginError"
            class="hidden p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200"
            role="alert"
          ></div>

          <div>
            <label
              for="email"
              class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
            >
              Email Address
            </label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              placeholder="admin@school.edu"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white/90 text-slate-800 text-sm"
            />
          </div>

          <div>
            <label
              for="password"
              class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
            >
              Password
            </label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="••••••••"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white/90 text-slate-800 text-sm"
            />
          </div>

          <button
            type="submit"
            id="loginSubmitBtn"
            class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-sm shadow-md hover:shadow-lg transition-all duration-150 disabled:opacity-50 disabled:cursor-wait"
          >
            Sign In to Dashboard
          </button>
        </form>
      </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-500">
      Findly AI &bull; Admin Portal Security
    </footer>

    <!-- Supabase CDN + Config + Login Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../config.js"></script>
    <script type="module" src="../assets/script/admin-login.js"></script>
  </body>
</html>
