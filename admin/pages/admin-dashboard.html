<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="icon" type="image/png" href="../assets/eye.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/admin-dashboard.css" />
  </head>
  <body class="min-h-screen flex flex-col justify-between font-sans">
    <!-- Header -->
    <nav class="w-full px-6 py-6 flex justify-center">
      <div class="admin-nav">
        <div class="nav-logo">
          <img
            src="../assets/eye.png"
            alt="Eye logo"
            class="w-8 h-8 object-contain"
          />
        </div>

        <h1 class="text-xl md:text-2xl font-bold text-slate-800 tracking-wide">
          Hi, <span id="admin-name">Admin</span>
        </h1>

        <div class="nav-avatar">
          <img
            id="admin-avatar"
            src="../assets/avatar.jpg"
            alt="Admin avatar"
            class="w-full h-full object-cover"
          />
        </div>
      </div>
    </nav>

    <!-- Stats (bawat card ay link papunta sa listahan) -->
    <main
      class="w-full max-w-5xl mx-auto px-6 py-4 grid grid-cols-1 md:grid-cols-2 gap-6 mb-auto"
    >
      <a class="stat-card" href="./missing-items.html">
        <div class="flex flex-col">
          <span class="stat-label">Missing Items</span>
          <span class="stat-value" data-stat="missing_items">--</span>
        </div>
        <svg
          class="stat-icon text-orange-500"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </a>

      <a class="stat-card" href="./found-items.html">
        <div class="flex flex-col">
          <span class="stat-label">Found Items</span>
          <span class="stat-value" data-stat="found_items">--</span>
        </div>
        <svg
          class="stat-icon text-amber-400"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M9 18h6"></path>
          <path d="M10 22h4"></path>
          <path
            d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"
          ></path>
        </svg>
      </a>

      <a class="stat-card" href="./match-items.html">
        <div class="flex flex-col">
          <span class="stat-label">Match Items</span>
          <span class="stat-value" data-stat="match_items">--</span>
        </div>
        <svg
          class="stat-icon text-orange-500"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
          ></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          <line x1="9" y1="12" x2="11" y2="12"></line>
          <line x1="9" y1="16" x2="11" y2="16"></line>
          <line x1="13" y1="12" x2="15" y2="12"></line>
          <line x1="13" y1="16" x2="15" y2="16"></line>
        </svg>
      </a>

      <a class="stat-card" href="./claimed-items.html">
        <div class="flex flex-col">
          <span class="stat-label">Claimed</span>
          <span class="stat-value" data-stat="claimed">--</span>
        </div>
        <svg
          class="stat-icon text-emerald-500"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
      </a>

      <section
        class="add-report-section border-1 border-gray-600 rounded-lg p-6 flex flex-col items-center justify-center text-center"
      >
        <a href="./report-found.html" class="add-report-btn">
          <span class="add-report-icon">+</span>

          <span class="add-report-text">
            <strong>Add Report Item</strong>
            <small>Register a newly found item</small>
          </span>

          <span class="add-report-arrow">→</span>
        </a>
      </section>
    </main>

    <footer class="py-4"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../../config.js"></script>
    <script type="module" src="../assets/script/admin-dashboard.js"></script>
  </body>
</html>
